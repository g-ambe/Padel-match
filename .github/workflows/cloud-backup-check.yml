name: クラウドバックアップ接続確認

# PR #176の同一リポジトリ・既存ブランチに付けたラベルでのみ実行する。
# 本番SQL適用・アプリのデプロイ・DBデータの取得は行わない。
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-backup-connection-check
  cancel-in-progress: false

jobs:
  connection-check:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 176 &&
       github.event.label.name == 'クラウドDB接続確認' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'codex/event-fixed-pairs') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 対象コミットを取得
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 接続確認ツールの回帰試験
        run: python3 -B -m unittest discover -s supabase/maintenance/event-fixed-pairs -p 'test_cloud_connection_probe.py' -v

      - name: 認証情報を送らずTCP・TLSを確認
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --transport-only

      - name: DBへの読み取り専用接続を確認
        env:
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py
