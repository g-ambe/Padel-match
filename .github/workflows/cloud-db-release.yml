name: 承認済みPR176のDB適用

on:
  pull_request:
    types: [labeled]

concurrency:
  group: padel-database-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  PADEL_RELEASE_AUTHORIZED: PR176-0040-20261105
  BACKUP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  prepare:
    if: >-
      github.event.pull_request.number == 176 &&
      github.event.pull_request.state == 'open' &&
      github.event.label.name == '承認済み0040適用' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/event-fixed-pairs'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.store.outputs.release_id }}
      asset_id: ${{ steps.store.outputs.asset_id }}
      sha256: ${{ steps.store.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BACKUP_SOURCE_SHA }}
          persist-credentials: false
      - name: mainの復旧点を記録
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/g-ambe/Padel-match/commits/main --jq '"sha=" + .sha' >> "$GITHUB_OUTPUT"
      - name: 暗号化設定を確認
        env:
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py readiness
      - name: 検証済みCLIを準備
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli
      - name: 合成DB・リリースガードの回帰試験
        env:
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
        run: |
          python3 -B - <<'PY'
          import re, sys, unittest
          directory = 'supabase/maintenance/event-fixed-pairs'
          sys.path.insert(0, directory)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover(directory, pattern='test_cloud_*.py'))
          for test, trace in result.errors + result.failures:
              message = re.sub(r'(?:https?|postgres(?:ql)?)://\S+', '[URL省略]', str(test) + '\n' + trace[-3000:])
              print('::error title=バックアップ合成試験::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: 公式CAを照合
        env:
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/padel-supabase-ca.crt
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca
      - name: 最新定義・02バックアップ・外部バックアップを取得
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/padel-supabase-ca.crt
          PADEL_BACKUP_WORKDIR: ${{ runner.temp }}/padel-release-backup
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
          BACKUP_MAIN_SHA: ${{ steps.baseline.outputs.sha }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_release.py prepare
      - name: 暗号化した実ファイルを未公開で保管
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
          PADEL_BACKUP_WORKDIR: ${{ runner.temp }}/padel-release-backup
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py publish

  rehearse:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BACKUP_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      BACKUP_ASSET_ID: ${{ needs.prepare.outputs.asset_id }}
      BACKUP_SHA256: ${{ needs.prepare.outputs.sha256 }}
      PADEL_BACKUP_WORKDIR: /tmp/padel-release-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BACKUP_SOURCE_SHA }}
          persist-credentials: false
      - name: 保管した実ファイルを別ジョブへ取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py download
      - name: 検証済みCLIを準備
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli
      - name: 本番接続を渡さず隔離復元・0040・03を試験
        env:
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_release.py rehearse
      - name: 未公開のまま復元・適用試験の成否を記録
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_release.py mark

  apply:
    needs: [prepare, rehearse]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BACKUP_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      BACKUP_ASSET_ID: ${{ needs.prepare.outputs.asset_id }}
      BACKUP_SHA256: ${{ needs.prepare.outputs.sha256 }}
      PADEL_BACKUP_WORKDIR: /tmp/padel-release-apply-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.BACKUP_SOURCE_SHA }}
          persist-credentials: false
      - name: 検証済みの暗号化ファイルを取得
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py download
      - name: 公式CAを照合
        env:
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/padel-supabase-ca.crt
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca
      - name: 直前差分と承認済みSQLを原子的に検証・適用
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/padel-supabase-ca.crt
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_release.py apply
