name: 本番表示の読み取り確認
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      score_diagnostic:
        description: スコア障害の読み取り専用確認
        type: boolean
        default: false
      profile_media_diagnostic:
        description: プロフィール画像APIの読み取り・未認証拒否確認
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  public-pages:
    if: >-
      (github.event_name != 'pull_request' && !inputs.score_diagnostic && !inputs.profile_media_diagnostic) ||
      (github.event.pull_request.number == 176 && github.event.label.name == '本番表示確認' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 本番ページを変更せず確認
        run: |
          python3 -B - <<'PY'
          import json, sys, time
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit
          base = 'https://padel-match.ranbo-ga.workers.dev'
          results = []
          for path in ['/', '/login', '/groups']:
              ok = False
              for attempt in range(3):
                  try:
                      with urlopen(Request(base + path, headers={'User-Agent':'Padel-release-readonly-check'}), timeout=30) as response:
                          body = response.read(2 * 1024 * 1024).decode('utf-8', errors='replace')
                          ok = response.status == 200 and urlsplit(response.url).hostname == urlsplit(base).hostname and '__next' in body and 'Application error' not in body
                      if ok: break
                  except Exception: pass
                  time.sleep(5)
              results.append({'path':path, 'html_ok':ok})
          print('::notice title=本番表示確認::' + json.dumps(results, ensure_ascii=False))
          sys.exit(0 if all(r['html_ok'] for r in results) else 1)
          PY
  profile-media-public:
    if: github.event_name == 'workflow_dispatch' && inputs.profile_media_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 本番プロフィール表示・未認証の取得更新拒否（実データ書込みなし）
        run: |
          python3 -B - <<'PY'
          import json, sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          base='https://padel-match.ranbo-ga.workers.dev'
          pid='00000000-0000-4000-8000-000000000001'
          results=[]
          try:
              with urlopen(base+'/profile',timeout=30) as r:
                  html=r.read(2*1024*1024).decode()
                  results.append({'profile_html':r.status==200 and 'Instagram' in html and 'Application error' not in html})
          except Exception as e:
              print('::notice title=TASK01プロフィールHTTP診断::'+json.dumps({'error_type':type(e).__name__,'status':getattr(e,'code',None),'reason_type':type(getattr(e,'reason',None)).__name__}))
              results.append({'profile_html':False})
          try:
              with urlopen(Request(base+'/profile',headers={'User-Agent':'Padel-release-readonly-check'}),timeout=30) as r:
                  html=r.read(2*1024*1024).decode()
                  print('::notice title=TASK01プロフィールUA診断::'+json.dumps({'status':r.status,'profile_html':'Instagram' in html}))
          except Exception as e:
              print('::notice title=TASK01プロフィールUA診断::'+json.dumps({'error_type':type(e).__name__,'status':getattr(e,'code',None)}))
          for suffix,method in [('', 'GET'),('/image','GET'),('','PUT'),('','PATCH'),('','DELETE')]:
              status=0;cache=''
              try:
                  with urlopen(Request(base+'/api/profile-media/'+pid+suffix,method=method,data=b'' if method in ('PUT','PATCH') else None),timeout=30) as r:status=r.status
              except HTTPError as e:status=e.code;cache=e.headers.get('Cache-Control','')
              except Exception as e:print('::notice title=TASK01画像API通信診断::'+json.dumps({'method':method,'error_type':type(e).__name__}))
              results.append({'method':method,'image':bool(suffix),'status':status,'cache':cache,'unauthenticated_rejected':status==401 and cache=='no-store'})
          ok=all(all(x.values()) for x in results[:1]) and all(x['unauthenticated_rejected'] for x in results[1:])
          print('::notice title=TASK01本番表示とアクセス制御::'+json.dumps(results,ensure_ascii=False))
          sys.exit(0 if ok else 1)
          PY
  score-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.score_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: 公式CAを照合
        env:
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/padel-supabase-ca.crt
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca
      - name: 件数と返却関係だけ確認（書込み禁止）
        env:
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/padel-supabase-ca.crt
        run: python3 -B supabase/maintenance/match-result-repair/score_diagnostic.py
