name: プロフィール表示位置0049の実バックアップ検証・適用
on:
  pull_request:
    types: [labeled]
concurrency:
  group: padel-profile-position-0049-release
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: read
jobs:
  verify-and-apply-0049:
    if: >-
      github.event.pull_request.number == 210 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/profile-r2-instagram' &&
      (github.event.label.name == '210隔離検証' || github.event.label.name == '210本番0049適用')
    permissions:
      contents: write # GitHub requires write access to read private draft-release assets.
      pull-requests: read
      checks: read
      actions: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BACKUP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BACKUP_RUN_ID: '44031769738'
      PADEL_BACKUP_WORKDIR: /tmp/padel-position210-${{ github.run_id }}-${{ github.run_attempt }}
      PADEL_BACKUP_CA_FILE: /tmp/padel-position210-ca.crt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BACKUP_SOURCE_SHA }}
          persist-credentials: false
      - name: 適用ガードの試験
        run: python3 -B -m unittest discover -s supabase/maintenance/profile-avatar-position -p test_cloud_release.py -v
      - name: 公式CAを照合
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca
      - name: 本番カタログ・未適用状態の読み取り確認
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
        run: python3 -B supabase/maintenance/profile-avatar-position/cloud_release.py preflight
      - name: 最新実バックアップと復元成功を固定照合
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/profile-avatar-position/cloud_release.py select-backup
      - name: 暗号化実ファイルを取得・照合
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py download
      - name: 検証済みCLIを準備
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli
      - name: 実データ隔離復元・0049・不変性・位置保存・復旧リハーサル
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
        run: python3 -B supabase/maintenance/profile-avatar-position/cloud_release.py rehearse
      - name: 検証済み0049のみ原子的に本番適用・事後確認
        if: github.event.label.name == '210本番0049適用'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_RELEASE_AUTHORIZED: PR210-0049-20261117
        run: python3 -B supabase/maintenance/profile-avatar-position/cloud_release.py apply

  diagnose-restore:
    if: >-
      github.event.pull_request.number == 210 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/profile-r2-instagram' &&
      github.event.label.name == '210復元差分調査'
    permissions:
      contents: write # GitHub requires write access to read private draft-release assets.
      pull-requests: read
      checks: read
      actions: read
      statuses: read
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BACKUP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BACKUP_RELEASE_ID: '448225790'
      BACKUP_ASSET_ID: '757867825'
      BACKUP_SHA256: e4aeef1ad6679455d6030825d6a229a1899338272a479c5f8b833724e512a87b
      PADEL_BACKUP_WORKDIR: /tmp/padel-position210-diagnostic-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BACKUP_SOURCE_SHA }}
          persist-credentials: false
      - name: 固定した暗号化実ファイルを取得・照合（診断専用）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py download
      - name: 検証済みCLIを準備
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli
      - name: 隔離復元の不一致箇所だけ診断（本番接続・SQL適用なし）
        env:
          GH_TOKEN: ${{ github.token }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
        run: python3 -B supabase/maintenance/profile-avatar-position/cloud_release.py diagnose-backup

  diagnose-storage:
    if: >-
      github.event.pull_request.number == 210 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/profile-r2-instagram' &&
      github.event.label.name == '210保管権限調査'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: 空の非公開保管先だけでAPI権限確認（DB接続・公開なし）
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_HEAD: ${{ github.event.pull_request.head.sha }}
          TEST_MAIN: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -B - <<'PY'
          import json, os, urllib.request, urllib.error
          base='https://api.github.com/repos/g-ambe/Padel-match'
          def api(path,method='GET',data=None):
              request=urllib.request.Request(base+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=30) as r:return r.status,json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  return e.code,{}
          results=[]
          for name,sha in [('head',os.environ['TEST_HEAD']),('main',os.environ['TEST_MAIN'])]:
              tag='db-storage-probe-'+os.environ['GITHUB_RUN_ID']+'-'+name
              status,value=api('/releases','POST',{'tag_name':tag,'target_commitish':sha,'name':tag,'draft':True,'body':'空の非公開保管権限確認。DBデータは含みません。'})
              record={'target':name,'create_http':status}
              if status==201:
                  if not value.get('draft') or value.get('assets'):raise SystemExit('unexpected_probe_release_state')
                  record['cleanup_http']=api('/releases/'+str(value['id']),'DELETE')[0]
                  tag_status,ref=api('/git/ref/tags/'+tag)
                  if tag_status==200:
                      if ref.get('object',{}).get('sha')!=sha:raise SystemExit('unexpected_probe_tag_state')
                      record['tag_cleanup_http']=api('/git/refs/tags/'+tag,'DELETE')[0]
              results.append(record)
          # Exercise the same gh create/upload path as cloud_backup.publish, without DB data.
          import subprocess, tempfile, re
          tag='db-backup-'+os.environ['GITHUB_RUN_ID']+'-cli-probe'
          payload={'tag_name':tag,'target_commitish':'f4108a9c82608363ba9dceab9a20561df470a431','name':'空の非公開保管調査 '+tag,'draft':True,'body':'DBデータを含まない保管API調査です。'}
          created=subprocess.run(['gh','api','--method','POST','repos/g-ambe/Padel-match/releases','--input','-'],input=json.dumps(payload).encode(),capture_output=True)
          record={'target':'original_tool_sha_via_gh','create_exit':created.returncode,'http_codes':re.findall(r'HTTP (\d{3})',created.stderr.decode())}
          if created.returncode==0:
              value=json.loads(created.stdout)
              if not value.get('draft') or value.get('assets'):raise SystemExit('unexpected_cli_probe_state')
              try:
                  with tempfile.NamedTemporaryFile() as file:
                      file.write(b'empty synthetic storage probe; no database data');file.flush()
                      uploaded=subprocess.run(['gh','api','--method','POST','https://uploads.github.com/repos/g-ambe/Padel-match/releases/'+str(value['id'])+'/assets?name=storage-probe.txt','--header','Content-Type: application/octet-stream','--input',file.name],capture_output=True)
                      record.update(upload_exit=uploaded.returncode,upload_http_codes=re.findall(r'HTTP (\d{3})',uploaded.stderr.decode()))
              finally:record['cleanup_http']=api('/releases/'+str(value['id']),'DELETE')[0]
          results.append(record)
          print('::notice title=バックアップ保管API権限::'+json.dumps(results))
          PY
