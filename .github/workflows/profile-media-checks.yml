name: Profile media isolated checks
on:
  pull_request:
    paths:
      - 'app/profile/**'
      - 'app/api/profile-media/**'
      - 'components/profile-media-*.tsx'
      - 'lib/profile-media/**'
      - 'supabase/migrations/0048_private_profile_media.sql'
      - 'tests/profile-media*.cjs'
      - 'tests/integration/profile-media-postgres.py'
      - '.github/workflows/profile-media-checks.yml'
permissions:
  contents: read
jobs:
  private-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: profile_media_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Locked Bun install
        run: |
          npm install --prefix "$RUNNER_TEMP/bun-tool" --no-package-lock --no-audit --no-fund bun@1.2.15
          "$RUNNER_TEMP/bun-tool/node_modules/.bin/bun" install --frozen-lockfile
      - name: Related unit and isolated SQL tests
        run: node --test tests/profile-media.test.cjs tests/profile-media-db.test.cjs tests/profile-media-api.test.cjs tests/profile-media-bindings.test.cjs
      - name: Real PostgreSQL multi-connection safety
        env:
          PROFILE_MEDIA_TEST_PG_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/profile_media_test
        run: python3 -B tests/integration/profile-media-postgres.py
