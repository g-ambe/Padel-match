name: PR207の実バックアップ検証・0048適用
on:
  pull_request:
    types: [labeled]
concurrency:
  group: padel-profile-media-207-release
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: read
  checks: read
  actions: read
  statuses: read
jobs:
  verify-and-apply-0048:
    if: >-
      github.event.pull_request.number == 207 &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/profile-r2-instagram' &&
      (github.event.label.name == '207隔離検証' || github.event.label.name == '207本番0048適用')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BACKUP_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      BACKUP_RUN_ID: '43993361424'
      PADEL_BACKUP_WORKDIR: /tmp/padel-profile207-${{ github.run_id }}-${{ github.run_attempt }}
      PADEL_BACKUP_CA_FILE: /tmp/padel-profile207-ca.crt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.BACKUP_SOURCE_SHA }}
          persist-credentials: false
      - name: 0048の適用ガード試験
        run: python3 -B -m unittest discover -s supabase/maintenance/profile-media -p test_cloud_release.py -v
      - name: 公式CAを照合
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca
      - name: 本番カタログ・未適用状態の読み取り確認
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
        run: python3 -B supabase/maintenance/profile-media/cloud_release.py preflight
      - name: 最新の非公開実バックアップと復元成功を固定照合
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/profile-media/cloud_release.py select-backup
      - name: 保管先の暗号化実ファイルを取得・照合
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py download
      - name: 検証済みCLIを準備
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli
      - name: 隔離復元・0048・本人権限・既存データ・切戻し再適用
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
        run: python3 -B supabase/maintenance/profile-media/cloud_release.py rehearse
      - name: 承認済み0048のみ原子的に本番適用・事後確認
        if: github.event.label.name == '207本番0048適用'
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_RELEASE_AUTHORIZED: PR207-0048-20261117
        run: python3 -B supabase/maintenance/profile-media/cloud_release.py apply
