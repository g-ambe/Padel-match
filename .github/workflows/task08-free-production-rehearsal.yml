# TASK-08: no paid Supabase Preview Branch. Existing read-only production
# backup machinery restores to a GitHub-hosted, network-isolated Docker DB.
# Explicit trigger-file push only; never on forks, PR payloads or default branch.
# No deployment, production writes, Stage writes, permanent backup artifacts,
# database migrations on hosted projects, or GitHub release publication.
name: TASK-08 no-cost isolated Phase1+Phase2 rehearsal
on:
  push:
    branches:
      - codex/task-08-group-foundation
    paths:
      - supabase/maintenance/group-foundation/.task08-free-rehearsal-trigger

permissions:
  contents: read

concurrency:
  group: task08-no-cost-isolated-prod-rehearsal
  cancel-in-progress: false

jobs:
  isolated-prod-rehearsal:
    if: >-
      github.repository == 'g-ambe/Padel-match' &&
      github.ref == 'refs/heads/codex/task-08-group-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Confirm existing secrets exist without outputting values
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Missing pre-existing read-only backup DB URL"; exit 2; }
          test -n "$PADEL_BACKUP_PASSPHRASE" || { echo "::error::Missing pre-existing backup passphrase"; exit 2; }

      - name: Check Python syntax without touching production
        run: python3 -B -m py_compile supabase/maintenance/group-foundation/151_h43_cost_free_isolated_rehearsal.py

      - name: Install exact verified Supabase CLI version used by existing backup workflow
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli

      - name: Prepare pinned official database CA
        env:
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/task08-h43-prod-ca.crt
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca

      - name: Actual Prod schema/data snapshot -> isolated PostgreSQL -> Phase1+Phase2 (all ephemeral)
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_BACKUP_PASSPHRASE: ${{ secrets.PADEL_BACKUP_PASSPHRASE }}
          PADEL_BACKUP_CA_FILE: ${{ runner.temp }}/task08-h43-prod-ca.crt
          PADEL_BACKUP_WORKDIR: ${{ runner.temp }}/task08-h43-${{ github.run_id }}-${{ github.run_attempt }}
          SUPABASE_BIN: ${{ runner.temp }}/supabase-tools/supabase
        run: |
          set -euo pipefail
          python3 -B supabase/maintenance/group-foundation/151_h43_cost_free_isolated_rehearsal.py

      - name: Ensure temporary backup and isolated DB are removed
        if: always()
        shell: bash
        env:
          PADEL_BACKUP_WORKDIR: ${{ runner.temp }}/task08-h43-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          rm -rf -- "$PADEL_BACKUP_WORKDIR"
          docker rm -f supabase_db_padel_backup_restore >/dev/null 2>&1 || true
          echo "H43 cleanup: ephemeral files and local PostgreSQL removed; no hosted database modified"
