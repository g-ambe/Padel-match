# H54 new app verification only. No hosted API, deployment or production secrets.
name: TASK-08 H54 new app checks and OpenNext build
on:
  push:
    branches:
      - codex/task-08-group-foundation
    paths:
      - supabase/maintenance/group-foundation/.task08-h54-app-trigger
permissions:
  contents: read
concurrency:
  group: task08-h54-app-checks
  cancel-in-progress: false
jobs:
  new-app:
    if: github.repository == 'g-ambe/Padel-match' && github.ref == 'refs/heads/codex/task-08-group-foundation' && contains(github.event.head_commit.message, '[task08-h54-app]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-only-not-a-hosted-key
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Explicit H54 no-deploy opt-in
        run: grep -qx 'H54_APP_CHECKS=1' supabase/maintenance/group-foundation/.task08-h54-app-trigger
      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/h54-bun" --no-package-lock --no-audit --no-fund bun@1.2.15
          test "$("$RUNNER_TEMP/h54-bun/node_modules/.bin/bun" --version)" = 1.2.15
          "$RUNNER_TEMP/h54-bun/node_modules/.bin/bun" install --frozen-lockfile --ignore-scripts
          # OpenNext invokes bun run build according to packageManager.
          echo "$RUNNER_TEMP/h54-bun/node_modules/.bin" >> "$GITHUB_PATH"
      - name: H54 current new app group and consent regression (synthetic)
        run: >-
          node --test
          tests/group-detail.test.cjs
          tests/group-read-client.test.cjs
          tests/group-read-interfaces.test.cjs
          tests/public-club-join.test.cjs
          tests/public-club-member-count.test.cjs
          tests/recipient-profile-link.test.cjs
          tests/h15-self-withdraw.test.cjs
          tests/h17-join-alias-db.test.cjs
          tests/h18-receiver-profile-link.test.cjs
          tests/h19-owner-transfer-db.test.cjs
          tests/h22-public-member-count.test.cjs
          tests/shared-event-page-rpc.test.cjs
          tests/shared-event-rpc-release.test.cjs
          tests/h31-token-video-click-gate.test.cjs
          tests/h32-token-click-migration-parity.test.cjs
          tests/h33-video-click-referrer-privacy.test.cjs
      - name: TypeScript check
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: OpenNext Cloudflare Worker build (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm run cf:build
          node -e "if (!require('./scripts/ensure-cloudflare-worker.cjs').current()) process.exit(1)"
          echo 'H54 PASS: Worker and assets match the current Next build. No deploy.'
