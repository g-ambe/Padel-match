# H55 synthetic local stack, real Auth/PostgREST; no hosted credentials.
name: TASK-08 H55 local Auth and HTTP environment
on:
  push:
    branches:
      - codex/task-08-group-foundation
    paths:
      - supabase/maintenance/group-foundation/.task08-h55-local-trigger
permissions:
  contents: read
concurrency:
  group: task08-h55-local-auth
  cancel-in-progress: false
jobs:
  local-auth:
    if: github.repository == 'g-ambe/Padel-match' && github.ref == 'refs/heads/codex/task-08-group-foundation' && contains(github.event.head_commit.message, '[task08-h55-local]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Explicit local synthetic-only opt-in
        run: grep -qx 'H55_LOCAL_AUTH=1' supabase/maintenance/group-foundation/.task08-h55-local-trigger
      - name: Compile local environment probe
        run: python3 -B -m py_compile supabase/maintenance/group-foundation/172_h55_local_auth_http_environment.py
      - name: Install existing pinned checksum-verified Supabase CLI
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_backup.py install-cli
      - name: Start private stack and test real Auth/PostgREST
        run: python3 -B supabase/maintenance/group-foundation/172_h55_local_auth_http_environment.py
      - name: Remove only this synthetic local stack and volumes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/task08-h55-synthetic"
          cli="$RUNNER_TEMP/supabase-tools/supabase"
          if [[ -d "$root/supabase" && -x "$cli" ]]; then
            (cd "$root"; env -i PATH="$PATH" HOME="$HOME" "$cli" stop --no-backup >/dev/null 2>&1) || true
          fi
          # This is a fresh dedicated runner. Remove only matching project containers.
          mapfile -t ids < <(docker --host=unix:///var/run/docker.sock ps -aq --filter 'name=task08-h55-synthetic')
          if (( ${#ids[@]} )); then docker --host=unix:///var/run/docker.sock rm -fv "${ids[@]}" >/dev/null; fi
          mapfile -t vols < <(docker --host=unix:///var/run/docker.sock volume ls -q --filter 'name=task08-h55-synthetic')
          if (( ${#vols[@]} )); then docker --host=unix:///var/run/docker.sock volume rm "${vols[@]}" >/dev/null; fi
          if docker --host=unix:///var/run/docker.sock network inspect task08-h55-local >/dev/null 2>&1; then
            docker --host=unix:///var/run/docker.sock network rm task08-h55-local >/dev/null
          fi
          rm -rf -- "$root"
          echo 'H55 synthetic local stack cleanup complete; no hosted writes'
