# TASK-08 P0: staging-only, manually triggered by editing the inert trigger file.
# Secrets are NEVER exposed to a forked PR or an arbitrary push path.
# No deployment, production access, app database writes, or PR merge.
name: TASK-08 staging B0 Auth HTTP
on:
  push:
    branches:
      - codex/task-08-group-foundation
    paths:
      - supabase/maintenance/group-foundation/.task08-b0-trigger

permissions:
  contents: read

concurrency:
  group: task08-staging-auth-http
  cancel-in-progress: false

jobs:
  staging-b0-http:
    if: github.repository == 'g-ambe/Padel-match' && github.ref == 'refs/heads/codex/task-08-group-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the existing task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check staging secret availability without printing values
        shell: bash
        env:
          TASK08_STAGING_PUBLISHABLE_KEY: ${{ secrets.TASK08_STAGING_PUBLISHABLE_KEY }}
          TASK08_STAGING_MAIN_A_PASSWORD: ${{ secrets.TASK08_STAGING_MAIN_A_PASSWORD }}
          TASK08_STAGING_RECIPIENT_PASSWORD: ${{ secrets.TASK08_STAGING_RECIPIENT_PASSWORD }}
          TASK08_STAGING_OUTSIDER_PASSWORD: ${{ secrets.TASK08_STAGING_OUTSIDER_PASSWORD }}
        run: |
          set -euo pipefail
          for var in TASK08_STAGING_PUBLISHABLE_KEY TASK08_STAGING_MAIN_A_PASSWORD TASK08_STAGING_RECIPIENT_PASSWORD TASK08_STAGING_OUTSIDER_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error title=Missing test secret::Missing ${var} in repository Actions secrets"
              exit 2
            fi
          done

      - name: Check B0 script syntax
        run: node --check supabase/maintenance/group-foundation/08_staging_auth_http_smoke.mjs

      - name: Isolated test dependency install
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task08-b0"
          cp supabase/maintenance/group-foundation/08_staging_auth_http_smoke.mjs "$RUNNER_TEMP/task08-b0/smoke.mjs"
          npm install --prefix "$RUNNER_TEMP/task08-b0" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2.112.1

      - name: Run B0 real Auth and PostgREST smoke (staging only)
        shell: bash
        env:
          TASK08_EXPECT_H06_CLOSED: '1'
          TASK08_EXPECT_H03_CLOSED: '1'
          TASK08_EXPECT_LEGACY_SUBMIT_CLOSED: '1'
          TASK08_STAGING_PUBLISHABLE_KEY: ${{ secrets.TASK08_STAGING_PUBLISHABLE_KEY }}
          TASK08_STAGING_MAIN_A_PASSWORD: ${{ secrets.TASK08_STAGING_MAIN_A_PASSWORD }}
          TASK08_STAGING_RECIPIENT_PASSWORD: ${{ secrets.TASK08_STAGING_RECIPIENT_PASSWORD }}
          TASK08_STAGING_OUTSIDER_PASSWORD: ${{ secrets.TASK08_STAGING_OUTSIDER_PASSWORD }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/task08-b0/smoke.mjs"

      # One-shot H09/H10 synthetic HTTP fixture check, removed after guarded cleanup.
      # No production credentials, merge, deploy, or unrelated database writes.
      - name: Check H09/H10 test script syntax
        run: node --check supabase/maintenance/group-foundation/45_h09_h10_stage_http_write_smoke.mjs

      - name: TypeScript and profile screen checks for task 08 branch
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/task08-bun" --no-package-lock --no-audit --no-fund bun@1.2.15
          "$RUNNER_TEMP/task08-bun/node_modules/.bin/bun" install --frozen-lockfile
          "$RUNNER_TEMP/task08-bun/node_modules/.bin/bun" x tsc --noEmit
          node --test tests/profile-v4.test.cjs

      - name: Run H09/H10 isolated stage JWT writes
        shell: bash
        env:
          TASK08_STAGE_H09_H10_WRITE: '1'
          TASK08_STAGING_PUBLISHABLE_KEY: ${{ secrets.TASK08_STAGING_PUBLISHABLE_KEY }}
          TASK08_STAGING_MAIN_A_PASSWORD: ${{ secrets.TASK08_STAGING_MAIN_A_PASSWORD }}
          TASK08_STAGING_RECIPIENT_PASSWORD: ${{ secrets.TASK08_STAGING_RECIPIENT_PASSWORD }}
          TASK08_STAGING_OUTSIDER_PASSWORD: ${{ secrets.TASK08_STAGING_OUTSIDER_PASSWORD }}
        run: |
          set -euo pipefail
          cp supabase/maintenance/group-foundation/45_h09_h10_stage_http_write_smoke.mjs "$RUNNER_TEMP/task08-b0/h09h10.mjs"
          node "$RUNNER_TEMP/task08-b0/h09h10.mjs"
