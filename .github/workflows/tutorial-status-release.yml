name: PR193 tutorial_statusの軽量適用
on:
  pull_request:
    types: [labeled]
concurrency:
  group: padel-tutorial0046-release
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
jobs:
  apply-0046:
    if: >-
      github.event.pull_request.number == 193 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/tutorial-manual-menu' &&
      github.event.label.name == '193本番0046適用'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TUTORIAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PADEL_BACKUP_CA_FILE: /tmp/padel-tutorial-ca.crt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TUTORIAL_SOURCE_SHA }}
          persist-credentials: false
      - name: 既存手順の公式CAを照合（バックアップは取得しない）
        run: python3 -B supabase/maintenance/event-fixed-pairs/cloud_connection_probe.py --prepare-ca
      - name: user_preferencesのみ事前確認・0046適用・読込保存確認
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_DB_URL: ${{ secrets.PADEL_BACKUP_DB_URL }}
          PADEL_TUTORIAL_SCHEMA_AUTHORIZED: PR193-0046
        run: python3 -B supabase/maintenance/tutorial-status/apply.py
